# v2 = v1 Nesterov + BatchNorm + a 2nd hidden layer (512 -> 256).
# BatchNorm changes the loss landscape, so the LR is measured again (LR range test on this config).
name: mlp_v2
data_dir: data/wikiart_style5

hidden: [512, 256]
activation: relu
batchnorm: true
init: kaiming

optimizer: sgd
momentum: 0.9
nesterov: true
lr: 1.1e-2  # LR range test, median of seeds 0-2 (v1 Nesterov without BatchNorm: 2.5e-3)
batch_size: 64
epochs: 100
patience: 10
