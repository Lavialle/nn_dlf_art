# v0: the naive MLP of the plan. One hidden layer, plain SGD, fixed learning rate, no regularisation.
name: mlp_v0
data_dir: data/wikiart_style5

hidden: [512]
activation: relu
init: kaiming

optimizer: sgd
lr: 0.01  # provisional: will be replaced by the LR range test result (block 16)
batch_size: 64
epochs: 30
