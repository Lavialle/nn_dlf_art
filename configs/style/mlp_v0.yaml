# v0: the naive MLP of the plan. One hidden layer, plain SGD, fixed learning rate, no regularisation.
name: mlp_v0
data_dir: data/wikiart_style5

hidden: [512]
activation: relu
init: kaiming

optimizer: sgd
lr: 0.01  # guessed on purpose (naive v0). LR range test (block 16): loss lowest at 3-7e-2, suggests 5.6e-3
batch_size: 64
epochs: 30
