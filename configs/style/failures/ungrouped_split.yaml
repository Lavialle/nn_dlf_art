# Failure 8: a split NOT grouped by artist (same painter in train and val). Expected: an inflated val score,
# which measures the leakage. Split built by scripts/make_splits.py --ungrouped.
name: ungrouped_split
split_file: splits/failures/wikiart_style5_ungrouped.csv
data_dir: data/wikiart_style5
group: failures
batch_size: 64
patience: null  # no early stopping: the whole curve is the evidence
hidden: [512]
optimizer: sgd
momentum: 0.9
nesterov: true
lr: 2.5e-3
epochs: 40
