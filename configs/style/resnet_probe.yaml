# ResNet18 pre-trained on ImageNet, linear probe: backbone frozen (BatchNorm in eval mode), only the head learns.
# Same data pipeline for the three levels (224 px, ImageNet statistics, crop + flip): only what learns changes.
name: resnet_probe
data_dir: data/wikiart_style5_224
group: resnet
model: resnet18
finetune: probe
image_size: 224
augment: true

optimizer: adamw
lr: 4.4e-3  # LR range test on this config, median of seeds 0-2 (a first run at 1.0e-3 was still improving at epoch 30)
weight_decay: 0.01  # AdamW's usual default
batch_size: 64
epochs: 50
patience: 10
