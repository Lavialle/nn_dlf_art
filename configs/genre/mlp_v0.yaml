# v0: the naive MLP of the plan. One hidden layer, plain SGD, fixed learning rate, no regularisation.
name: mlp_v0
data_dir: data/wikiart_genre5

hidden: [512]
activation: relu
init: kaiming

optimizer: sgd
lr: 0.01  # guessed on purpose (naive v0). LR range test on genre: suggests 4.8e-3
batch_size: 64
epochs: 30
